# Runs collector.py on GitHub's servers so no laptop has to stay on.
# Each run collects for just under 6 hours (GitHub's limit per job) and then
# saves the data as a downloadable "artifact". A new run starts every 6 hours.
name: collect

on:
  workflow_dispatch:        # start by hand from the Actions tab or `gh workflow run collect`
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC

concurrency: collect        # never two collectors at once

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -u collector.py --minutes 345
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ github.run_id }}
          path: data/
          retention-days: 30
          compression-level: 0   # the files are already gzip
